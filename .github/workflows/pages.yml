name: GitHub Pages

# Veröffentlicht DENKSPINNE als spielbare Seite.
# "enablement: true" schaltet GitHub Pages beim ersten Lauf selbst ein,
# es muss nichts in den Repository-Einstellungen umgestellt werden.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Das Spiel liegt zusätzlich als index.html, damit die Adresse ohne
      # Dateinamen direkt ins Spiel führt.
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp denkspinne.html _site/denkspinne.html
          cp denkspinne.html _site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
